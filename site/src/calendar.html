<!doctype html>
<html lang="en">
<head>
{{head:Book a Lesson — Excellence Swimming|Browse live availability by coach and location and book your swim lesson in a few taps.}}
</head>
<body class="page-calendar">
<!-- FRAME: 04_Calendar · every Book Now on the site lands here.
     Wix build: Tabs element (one tab per lesson format) → each tab holds a Wix Bookings
     "Booking Calendar" widget set to that service, with Location + Staff filters switched on. -->
{{header:solid:calendar}}

<main id="main">

  <section class="cal-head" aria-labelledby="cal-title">
    <div class="container cal-head__row">
      <div class="stack gap-2">
        <p class="t-label eyebrow">Calendar</p>
        <h1 class="t-h1" id="cal-title">Book a lesson.</h1>
      </div>
      <p class="signin">Booked before? <a href="#">Sign in</a> to see or change your bookings.</p>
    </div>
  </section>

  <section class="cal-shell" aria-label="Availability">
    <div class="container">
      {{partial:calendar-widget}}

    </div>
  </section>


</main>

{{footer}}
</body>
</html>
