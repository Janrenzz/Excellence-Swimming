<!-- Calendar Widget · Wix: Tabs (one per lesson format) → Wix Bookings "Booking Calendar" widget per tab,
     Location + Staff filters on. Used on the Calendar page and the Home page. -->
<div class="cal-widget" data-cal-widget>
      <div class="tabs cal-tabs" role="tablist" aria-label="Lesson format" data-cal-tabs>
        <button class="tab" role="tab" aria-selected="true" data-format="1:1"><span class="tab__ratio">1:1</span><span class="tab__name"> Private</span><span class="cal-tab__sub">1 swimmer</span></button>
        <button class="tab" role="tab" aria-selected="false" data-format="2:1"><span class="tab__ratio">2:1</span><span class="tab__name"> Semi-private</span><span class="cal-tab__sub">2 swimmers</span></button>
        <button class="tab" role="tab" aria-selected="false" data-format="3:1"><span class="tab__ratio">3:1</span><span class="tab__name"> Small group</span><span class="cal-tab__sub">3 swimmers</span></button>
        <button class="tab" role="tab" aria-selected="false" data-format="4:1"><span class="tab__ratio">4:1</span><span class="tab__name"> Group</span><span class="cal-tab__sub">4 swimmers</span></button>
      </div>

      <div class="cal" data-cal>
        <div class="cal__filters">
          <div class="field"><label for="f-coach">Coach</label>
            <select class="input" id="f-coach" data-filter="coach">
              <option value="any">Any coach</option>
              <option value="ruslan">Ruslan Gaziev</option>
              <option value="hannah">Hannah Bach</option>
            </select></div>
          <div class="field"><label for="f-loc">Location</label>
            <select class="input" id="f-loc" data-filter="location">
              <option value="any">Any location</option>
              <option value="loc-1">St. Charles · Bexley</option>
              <option value="loc-2">[Second location]</option>
            </select></div>
          <p class="cal__tz">Times shown in Eastern Time (ET)</p>
        </div>

        <div class="cal__month">
          <div class="month__head">
            <button class="icon-btn" type="button" data-month="-1" aria-label="Previous month">←</button>
            <p class="month__title" data-month-title aria-live="polite"></p>
            <button class="icon-btn" type="button" data-month="1" aria-label="Next month">→</button>
          </div>
          <div class="month__grid" data-month-grid></div>
        </div>

        <div class="week" data-week aria-label="Choose a day"></div>

        <div class="cal__slots">
          <p class="slots__title" data-slots-title aria-live="polite"></p>
          <div data-slots></div>
        </div>

        <aside class="cal__summary" aria-label="Booking summary">
          <p class="slots__title">Your booking</p>
          <ul class="summary__list" data-summary></ul>
          <a class="btn btn--block" href="#" data-next aria-disabled="true">Next</a>
          <p class="note">Next takes you to secure checkout to add swimmer details and pay.</p>
        </aside>
      </div>
<!-- Mobile only · booking summary bar (pinned on the Calendar page, inline on Home) -->
  <div class="cal-sticky" data-sticky>
    <p class="cal-sticky__text" data-sticky-text>Pick a time<span>Choose a day, then a time</span></p>
    <a class="btn btn--sm" href="#" data-next aria-disabled="true">Next</a>
  </div>
      <p class="cal-note">Prototype: availability shown here is sample data. On the live site it comes from Wix Bookings.</p>
</div>
